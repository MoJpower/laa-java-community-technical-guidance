server:
  port: 8081 # change to desired port number

spring:
  application:
    name: laa-spring-boot-library-tutorial
    version: @version@

  # PostgreSQL datasource - connection details injected from environment (RDS in deployed envs,
  # local postgres container in docker-compose). All four vars have localhost defaults so the
  # service also starts when running directly via IntelliJ / bootRun without Docker.
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:spring-boot-library-tutorial_dev}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:dev}

  flyway:
    enabled: true
    schemas: public
    out-of-order: false

  #do not auto create db schema, use Flyway migrations
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

management:
  server:
    port: 8181 # change to desired port number
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: ${spring.application.name}
    version: ${spring.application.version}
    description: Companion service for the LAA Java tutorials

sentry:
  dsn: # configure dsn url here
  environment: # configure environment name here

# ECS structured logging
logging:
  level:
    root: ${ROOT_LOGGING_LEVEL:info}
    org.springframework: ${SPRING_LOGGING_LEVEL:info}
    uk.gov.justice.laa.library.tutorial: ${APP_LOGGING_LEVEL:info}
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name:default}
        version: ${spring.application.version:default}
        environment: ${spring.profiles.active:default}
        node_name: ${HOSTNAME:unknown}

---
# local profile configuration
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    root: ${ROOT_LOGGING_LEVEL:info}
    org.springframework: ${SPRING_LOGGING_LEVEL:info}
    uk.gov.justice.laa.library.tutorial: ${APP_LOGGING_LEVEL:info}
  structured:
    format:
      console: # disables structured logging locally
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr{faint} %clr([%15.15t]){faint} %clr([%X{traceId:-},%X{spanId:-}]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"
