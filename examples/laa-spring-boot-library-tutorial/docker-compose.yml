services:
  postgres:
    image: postgres:18
    container_name: spring-boot-library-tutorial-postgres
    environment:
      POSTGRES_DB: spring-boot-library-tutorial_dev
      POSTGRES_USER: user
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d spring-boot-library-tutorial_dev"]
      interval: 5s
      retries: 10


  app:
    build:
      context: .
    ports:
      - "8081:8081"
      - "8181:8181"
      - "5005:5005"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_NAME=spring-boot-library-tutorial_dev
      - DB_USERNAME=user
      - DB_PASSWORD=dev
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=local
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
